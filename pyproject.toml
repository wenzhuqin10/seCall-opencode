[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "secall-opencode"
version = "0.9.0"
description = "Convert OpenCode and ChatGPT sessions into seCall Vault sessions, Issue Cards, and grounded QA candidates."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "wenzhuqin10" }]
keywords = ["opencode", "secall", "session-log", "knowledge-base", "qa"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
semantic = [
  "numpy>=1.21.6,<3",
  "onnxruntime>=1.19,<2",
  "tokenizers>=0.20,<1",
]

[project.scripts]
secall-opencode = "secall_opencode.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
secall_opencode = ["prompts/*.md"]
